[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aaron-model-testing"
version = "0.1.0"
description = "Reproducible local GGUF optimisation, performance and capability benchmarks"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "psutil>=6,<8", "gguf>=0.17,<1", "jsonschema>=4.23,<5", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
aaron-model-testing = "aaron_model_testing.cli:main"

[tool.setuptools.packages.find]
include = ["aaron_model_testing*"]

[tool.setuptools.package-data]
aaron_model_testing = ["static/*", "benchmarks/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["aaron_model_testing/vendor", ".research", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
